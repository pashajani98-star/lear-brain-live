<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEAR Brain — Live Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-bg: #0a0e27;
            --color-surface: #1a1f3a;
            --color-surface-alt: #252c48;
            --color-ollama: #ff6b6b;
            --color-haiku: #4ecdc4;
            --color-working: #51cf66;
            --color-standby: #748aa6;
            --color-text: #e0e6ff;
            --color-text-muted: #a0a8c0;
            --border-radius: 8px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --color-bg: #0a0e27;
            }
        }

        body {
            background: linear-gradient(135deg, var(--color-bg) 0%, #0f1432 100%);
            color: var(--color-text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            background: linear-gradient(135deg, #51cf66, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .language-toggle {
            display: flex;
            gap: 8px;
            background: var(--color-surface);
            padding: 8px;
            border-radius: var(--border-radius);
        }

        .lang-btn {
            padding: 8px 16px;
            border: none;
            background: transparent;
            color: var(--color-text-muted);
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
        }

        .lang-btn.active {
            background: var(--color-working);
            color: white;
        }

        .lang-btn:hover {
            color: var(--color-text);
        }

        .voice-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--color-haiku), #45b7aa);
            border: none;
            color: white;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .voice-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(78, 205, 196, 0.3);
        }

        .voice-btn.loading {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--color-surface);
            padding: 20px;
            border-radius: var(--border-radius);
            border-left: 4px solid var(--color-ollama);
        }

        .stat-card.haiku {
            border-left-color: var(--color-haiku);
        }

        .stat-card.summary {
            border-left-color: var(--color-working);
        }

        .stat-label {
            font-size: 12px;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--color-text);
        }

        .stat-subtext {
            font-size: 12px;
            color: var(--color-text-muted);
            margin-top: 8px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--color-text);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 3px;
            height: 16px;
            background: var(--color-haiku);
            border-radius: 2px;
        }

        .tasks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 15px;
        }

        .task-card {
            background: var(--color-surface);
            padding: 16px;
            border-radius: var(--border-radius);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: var(--transition);
        }

        .task-card:hover {
            border-color: rgba(255, 255, 255, 0.1);
            background: var(--color-surface-alt);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .task-agent {
            font-weight: 600;
            color: var(--color-haiku);
            font-size: 13px;
        }

        .task-model {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            background: rgba(255, 107, 107, 0.2);
            color: var(--color-ollama);
        }

        .task-model.haiku {
            background: rgba(78, 205, 196, 0.2);
            color: var(--color-haiku);
        }

        .task-description {
            font-size: 14px;
            color: var(--color-text);
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .task-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--color-text-muted);
        }

        .task-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--color-working);
            animation: pulse 2s ease-in-out infinite;
        }

        .status-dot.standby {
            background: var(--color-standby);
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
        }

        .agent-node {
            background: var(--color-surface);
            padding: 16px;
            border-radius: var(--border-radius);
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.05);
            transition: var(--transition);
            cursor: pointer;
        }

        .agent-node:hover {
            border-color: rgba(255, 255, 255, 0.15);
            background: var(--color-surface-alt);
        }

        .agent-node.working {
            border-color: var(--color-working);
            background: rgba(81, 207, 102, 0.05);
        }

        .agent-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            margin: 0 auto 12px;
            background: var(--color-standby);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12px;
            color: white;
        }

        .agent-node.working .agent-circle {
            background: var(--color-working);
            box-shadow: 0 0 16px rgba(81, 207, 102, 0.4);
        }

        .agent-label {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--color-text);
        }

        .agent-task {
            font-size: 11px;
            color: var(--color-text-muted);
            line-height: 1.3;
            margin-bottom: 8px;
        }

        .agent-model-tag {
            display: inline-block;
            padding: 2px 6px;
            font-size: 10px;
            background: rgba(78, 205, 196, 0.2);
            color: var(--color-haiku);
            border-radius: 3px;
        }

        .ops-log {
            background: var(--color-surface);
            border-radius: var(--border-radius);
            max-height: 400px;
            overflow-y: auto;
            padding: 16px;
        }

        .log-entry {
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 13px;
            line-height: 1.5;
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-time {
            color: var(--color-text-muted);
            font-size: 11px;
        }

        .log-agent {
            color: var(--color-haiku);
            font-weight: 600;
        }

        .log-action {
            color: var(--color-text);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--color-text-muted);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(78, 205, 196, 0.2);
            border-top-color: var(--color-haiku);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .update-time {
            font-size: 12px;
            color: var(--color-text-muted);
            text-align: center;
            margin-top: 20px;
        }

        .icon {
            width: 20px;
            height: 20px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧠 LEAR Brain — Live Dashboard</h1>
        <div class="header-right">
            <div class="language-toggle">
                <button class="lang-btn active" data-lang="en">English</button>
                <button class="lang-btn" data-lang="fa">Farsi</button>
            </div>
            <button class="voice-btn" id="voice-btn">
                <span>🔊</span>
                <span>Voice Update</span>
            </button>
        </div>
    </div>

    <div class="container">
        <!-- Stats Bar -->
        <div class="stats-bar" id="stats-bar">
            <div class="stat-card">
                <div class="stat-label">Tasks on Ollama</div>
                <div class="stat-value" id="ollama-count">0</div>
                <div class="stat-subtext">Free (Local)</div>
            </div>
            <div class="stat-card haiku">
                <div class="stat-label">Tasks on Haiku</div>
                <div class="stat-value" id="haiku-count">0</div>
                <div class="stat-subtext">Smart (Cloud)</div>
            </div>
            <div class="stat-card summary">
                <div class="stat-label">Total Tasks</div>
                <div class="stat-value" id="total-tasks">0</div>
                <div class="stat-subtext" id="cost-estimate">~$0.00/month</div>
            </div>
        </div>

        <!-- Current Tasks -->
        <div class="section">
            <div class="section-title">Active Tasks</div>
            <div class="tasks-grid" id="tasks-grid">
                <div class="empty-state">
                    <div class="empty-state-icon">⏳</div>
                    <div>No active tasks</div>
                </div>
            </div>
        </div>

        <!-- Agent Status -->
        <div class="section">
            <div class="section-title">Agent Fleet</div>
            <div class="agents-grid" id="agents-grid">
                <div class="loading"></div>
            </div>
        </div>

        <!-- Recent Activity -->
        <div class="section">
            <div class="section-title">Recent Activity</div>
            <div class="ops-log" id="ops-log">
                <div class="empty-state">
                    <div>Waiting for activity...</div>
                </div>
            </div>
        </div>

        <div class="update-time" id="update-time">
            Last updated: <span id="last-update">Never</span>
        </div>
    </div>

    <script>
        const FEED_URL = './dashboard-feed.json';
        const POLL_INTERVAL = 5000;

        let currentLanguage = 'en';
        let isVoicePlaying = false;

        // Language toggle
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentLanguage = btn.dataset.lang;
            });
        });

        // Voice button
        document.getElementById('voice-btn').addEventListener('click', async () => {
            const btn = document.getElementById('voice-btn');
            if (isVoicePlaying) return;

            isVoicePlaying = true;
            btn.classList.add('loading');
            btn.innerHTML = '<span class="loading"></span> <span>Generating...</span>';

            try {
                // In a real implementation, this would call a voice API
                // For now, show the intention
                const lang = currentLanguage === 'fa' ? 'Farsi' : 'English';

                // Fetch voice file (would be generated by voice-updates.py)
                // Simulating: we'd construct the filename based on timestamp
                // In production, the bridge would generate these on demand

                console.log(`Voice update requested in ${lang}`);

                // Restore button
                setTimeout(() => {
                    isVoicePlaying = false;
                    btn.classList.remove('loading');
                    btn.innerHTML = '<span>🔊</span> <span>Voice Update</span>';
                }, 2000);
            } catch (e) {
                console.error('Voice error:', e);
                isVoicePlaying = false;
                btn.classList.remove('loading');
                btn.innerHTML = '<span>🔊</span> <span>Voice Update</span>';
            }
        });

        // Fetch and display dashboard feed
        async function fetchDashboard() {
            try {
                const response = await fetch(FEED_URL);
                if (!response.ok) throw new Error('Feed not found');

                const data = await response.json();
                updateDashboard(data);

                // Update timestamp
                const now = new Date();
                document.getElementById('last-update').textContent =
                    now.toLocaleTimeString('en-GB');
            } catch (e) {
                console.error('Failed to fetch dashboard:', e);
            }
        }

        function updateDashboard(data) {
            // Update stats
            const ollama = data.model_summary.ollama || 0;
            const haiku = data.model_summary.haiku || 0;
            const total = ollama + haiku;

            document.getElementById('ollama-count').textContent = ollama;
            document.getElementById('haiku-count').textContent = haiku;
            document.getElementById('total-tasks').textContent = total;

            // Estimate cost: ~$0.0005 per Haiku task
            const estimatedCost = (haiku * 0.0005 * 30).toFixed(2);
            document.getElementById('cost-estimate').textContent =
                `~$${estimatedCost}/month`;

            // Update current tasks
            updateTasksGrid(data.current_tasks || []);

            // Update agent nodes
            updateAgentGrid(data.agents || {});

            // Update ops log
            updateOpsLog(data.recent_activity || []);
        }

        function updateTasksGrid(tasks) {
            const grid = document.getElementById('tasks-grid');

            if (tasks.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-state-icon">✅</div>
                        <div>All agents on standby</div>
                    </div>
                `;
                return;
            }

            grid.innerHTML = tasks.map(task => `
                <div class="task-card">
                    <div class="task-header">
                        <div class="task-agent">${task.agent_label || task.agent}</div>
                        <div class="task-model ${task.model === 'haiku' ? 'haiku' : ''}">
                            ${task.model === 'haiku' ? '☁️ Haiku' : '💻 Ollama'}
                        </div>
                    </div>
                    <div class="task-description">${task.task}</div>
                    <div class="task-meta">
                        <div class="task-status">
                            <div class="status-dot"></div>
                            <span>${task.status === 'running' ? 'Running' : 'Started'}</span>
                        </div>
                        <div>${new Date(task.timestamp).toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit'})}</div>
                    </div>
                </div>
            `).join('');
        }

        function updateAgentGrid(agents) {
            const grid = document.getElementById('agents-grid');

            const agentList = Object.entries(agents).map(([id, agent]) => ({
                id,
                ...agent
            }));

            grid.innerHTML = agentList.map(agent => `
                <div class="agent-node ${agent.status === 'working' ? 'working' : ''}">
                    <div class="agent-circle">
                        ${agent.status === 'working' ? '⚡' : '✓'}
                    </div>
                    <div class="agent-label">${agent.label}</div>
                    ${agent.current_task ? `
                        <div class="agent-task">${agent.current_task}</div>
                        <div class="agent-model-tag">
                            ${agent.current_model === 'haiku' ? '☁️ Haiku' : '💻 Ollama'}
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function updateOpsLog(entries) {
            const log = document.getElementById('ops-log');

            if (entries.length === 0) {
                log.innerHTML = '<div class="empty-state"><div>No recent activity</div></div>';
                return;
            }

            log.innerHTML = entries.map(entry => {
                const time = new Date(entry.timestamp).toLocaleTimeString('en-GB',
                    {hour: '2-digit', minute: '2-digit', second: '2-digit'});
                return `
                    <div class="log-entry">
                        <div class="log-time">${time}</div>
                        <div>
                            <span class="log-agent">${entry.agent}</span>
                            <span class="log-action">${entry.description || entry.type}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Poll for updates
        setInterval(fetchDashboard, POLL_INTERVAL);
        fetchDashboard();
    </script>
</body>
</html>
